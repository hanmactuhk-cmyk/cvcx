name: Build Flow Studio Automation EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check automation/flow-runner.js
          node --check automation/profile-manager.js
          node --check renderer/app.js

      - name: Build Windows EXE
        run: npm run build

      - name: Show release files
        shell: pwsh
        run: |
          if (Test-Path release) {
            Get-ChildItem release -Recurse | Select-Object FullName,Length
          } else {
            Write-Error "release folder was not created"
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Studio-Automation-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
